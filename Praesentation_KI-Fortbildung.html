<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Künstliche Intelligenz im Schulalltag – Fortbildung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --fach: #20213a;
      --fach-deep: #16172b;
      --fach-light: #6c4ff8;
      --ink: #20213a;
      --sub: #66677d;
      --bg: #f7f6fc;
      --card: #ffffff;
      --card-border: #e8e5f3;
      --accent-a: #8b5cf6;
      --accent-b: #ff6f61;
      --accent-c: #17b897;
      --warn-bg: #fff4dc;
      --warn-border: #f2b84b;
      --info-bg: #ece8ff;
      --danger-bg: #ffe7e3;
      --danger-border: #e75b50;
      --serif: "General Sans", "Avenir Next", Arial, sans-serif;
      --mono: "Inter", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    :root {
      --app-height: 100vh;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      font-family: var(--serif);
      color: var(--ink);
    }

    body {
      overflow: hidden;
      height: var(--app-height);
    }

    /* ---------- progress bar ---------- */
    #progress-track {
      position: fixed;
      left: 0;
      top: 0;
      width: 7px;
      height: var(--app-height);
      background: var(--accent-a);
      z-index: 50;
    }

    #progress-mask {
      position: fixed;
      left: 0;
      width: 7px;
      height: var(--app-height);
      top: 0;
      background: var(--fach);
      z-index: 51;
      transition: top .35s ease;
    }

    #progress-dot {
      position: fixed;
      left: -4px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent-a);
      border: 2px solid var(--fach);
      box-shadow: none;
      z-index: 52;
      transition: top .35s ease, border-color .35s ease;
      transform: translateY(-50%);
    }

    /* ---------- shell ---------- */
    #deck {
      position: relative;
      width: 100%;
      height: var(--app-height);
      padding-left: 7px;
    }

    .slide {
      position: absolute;
      inset: 0;
      left: 7px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: clamp(20px, 4.6vh, 52px) clamp(92px, 7vw, 132px) clamp(56px, 9.5vh, 96px) clamp(92px, 7vw, 132px);
      padding-right: calc(clamp(92px, 7vw, 132px) + var(--safe-r));
      padding-left: calc(clamp(92px, 7vw, 132px) + var(--safe-l));
      opacity: 0;
      visibility: hidden;
      transform: translateX(24px);
      transition: opacity .35s ease, transform .35s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }

    .kicker {
      font-family: var(--mono);
      font-size: clamp(.64rem, .57rem + .28vw, .76rem);
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--fach);
      margin: 0 0 .8rem 0;
    }

    h1.title {
      font-family: var(--serif);
      font-size: clamp(1.9rem, 1.15rem + 2.5vw, 3.25rem);
      line-height: 1;
      letter-spacing: -.025em;
      margin: 0 0 .65rem 0;
      color: var(--fach);
      font-weight: 500;
      overflow-wrap: break-word;
      text-wrap: balance;
    }

    .subtitle {
      font-size: clamp(.95rem, .82rem + .5vw, 1.18rem);
      color: var(--sub);
      margin: 0 0 1.6rem 0;
      font-weight: 400;
    }

    .lead {
      font-size: clamp(1.08rem, .9rem + .65vw, 1.42rem);
      line-height: 1.38;
      color: var(--ink);
      max-width: 58ch;
      margin: .35rem 0 1.45rem 0;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    /* editorial visuals */
    .model-split .steps {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .65rem;
    }

    .model-split .step {
      min-width: 0;
    }

    .model-split .arrow {
      display: none;
    }

    .cards.stacked {
      grid-template-columns: 1fr;
      gap: .7rem;
    }

    .cards.stacked .card {
      padding: .75rem 1rem;
    }

    .cards.stacked .card p {
      font-size: .9rem;
    }

    /* cover slide */
    .cover {
      display: grid;
      grid-template-columns: minmax(280px, .82fr) minmax(420px, 1.18fr);
      grid-template-rows: auto auto auto 1fr;
      column-gap: clamp(1.5rem, 4vw, 3.2rem);
      align-content: center;
      align-items: start;
      overflow: hidden;
      background: var(--fach);
      color: var(--bg);
    }

    .cover .content {
      display: contents;
    }

    .cover .kicker {
      grid-column: 1;
      grid-row: 1;
      position: relative;
      z-index: 3;
      color: var(--accent-a);
      font-size: clamp(.72rem, .6rem + .35vw, .88rem);
    }

    .cover h1.title {
      grid-column: 1;
      grid-row: 2;
      position: relative;
      z-index: 3;
      color: var(--accent-a);
      font-size: clamp(2.4rem, 1.2rem + 4.1vw, 4.8rem);
      line-height: .92;
      max-width: 11ch;
    }

    .cover .subtitle {
      grid-column: 1;
      grid-row: 3;
      position: relative;
      z-index: 3;
      color: var(--bg);
      font-size: clamp(1.02rem, .85rem + .6vw, 1.3rem);
      max-width: 32ch;
    }

    .cover .meta {
      grid-column: 1;
      grid-row: 4;
      position: relative;
      z-index: 3;
      margin-top: 1.2rem;
      font-family: var(--mono);
      font-size: .76rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent-a);
      border-top: 2px solid var(--accent-a);
      padding-top: 1rem;
      align-self: start;
    }

    .closing {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .closing,
    .slide-summary {
      background: var(--fach);
      color: var(--bg);
    }

    .closing h1.title,
    .slide-summary h1.title {
      color: var(--accent-a);
    }

    .closing .kicker,
    .slide-summary .kicker {
      color: var(--accent-a);
    }

    .closing p {
      color: var(--bg);
    }

    .closing h1.title {
      font-size: clamp(2.8rem, 2rem + 3vw, 5rem);
    }

    .slide-summary .num-list li {
      border-color: var(--accent-a);
    }

    .slide-summary .num-list .n {
      border-color: var(--accent-a);
      color: var(--accent-a);
    }

    .slide-summary .num-list .t {
      color: var(--bg);
    }

    .slide-pink {
      background: var(--accent-a);
      color: var(--fach-deep);
    }

    .slide-pink h1.title,
    .slide-pink .kicker {
      color: var(--fach-deep);
    }

    /* cards grid */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .cards.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .card {
      background: var(--card);
      border: 2px solid var(--fach);
      border-radius: 6px;
      padding: 1rem 1.2rem;
    }

    .card h2 {
      margin: 0 0 .45rem 0;
      font-size: 1.12rem;
      line-height: 1.05;
      font-weight: 500;
      color: var(--fach);
    }

    .card p {
      margin: 0;
      font-size: .95rem;
      line-height: 1.45;
      color: var(--ink);
    }

    .cards>.card:nth-child(3n+1) {
      background: var(--fach);
      color: var(--bg);
    }

    .cards>.card:nth-child(3n+1) h2 {
      color: var(--accent-a);
    }

    .cards>.card:nth-child(3n+1) p {
      color: var(--bg);
    }

    .cards>.card:nth-child(3n+2) {
      background: var(--accent-a);
      color: var(--fach-deep);
      border-color: var(--accent-b);
    }

    .cards>.card:nth-child(3n+2) h2,
    .cards>.card:nth-child(3n+2) p {
      color: var(--fach-deep);
    }

    /* timeline */
    .timeline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 2.5rem;
    }

    .timeline h3 {
      color: var(--fach);
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin: 0 0 .6rem 0;
    }

    .t-item {
      display: flex;
      gap: 1rem;
      padding: .46rem 0;
      border-bottom: 1px solid rgba(46, 74, 42, .42);
      align-items: baseline;
    }

    .t-item .time {
      font-family: var(--mono);
      font-weight: 500;
      color: var(--fach);
      min-width: 3.4rem;
      font-size: .84rem;
    }

    .t-item .what {
      font-size: .95rem;
    }

    .timeline-note {
      grid-column: 1/-1;
      margin-top: .8rem;
      font-size: .9rem;
      color: var(--sub);
      font-style: italic;
    }

    /* options / blitzlicht */
    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .option {
      background: var(--card);
      border: 2px solid var(--fach);
      border-radius: 6px;
      padding: 1.1rem;
      text-align: left;
    }

    .option:nth-child(1) {
      background: var(--fach);
      color: var(--bg);
    }

    .option:nth-child(2) {
      background: var(--accent-a);
      color: var(--fach-deep);
      border-color: var(--accent-b);
    }

    .option .name {
      font-family: var(--mono);
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--fach);
      font-size: .78rem;
      margin-bottom: .5rem;
    }

    .option:nth-child(1) .name,
    .option:nth-child(1) .quote {
      color: var(--accent-a);
    }

    .option .quote {
      font-style: italic;
      color: var(--sub);
      font-size: .95rem;
    }

    /* numbered steps horizontal */
    .steps {
      display: flex;
      align-items: stretch;
      gap: .6rem;
      flex-wrap: wrap;
    }

    .step {
      flex: 1;
      min-width: 150px;
      background: var(--card);
      border: 2px solid var(--fach);
      border-radius: 6px;
      padding: 1rem;
      position: relative;
    }

    .step:nth-of-type(1) {
      background: var(--fach);
      color: var(--bg);
    }

    .step:nth-of-type(5) {
      background: var(--accent-a);
      color: var(--fach-deep);
      border-color: var(--accent-b);
    }

    .step .num {
      display: block;
      width: auto;
      height: auto;
      border-radius: 0;
      background: none;
      color: var(--fach);
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .14em;
      font-weight: 500;
      margin-bottom: .55rem;
    }

    .step:nth-of-type(1) .num {
      color: var(--accent-a);
    }

    .step .txt {
      font-size: .92rem;
      line-height: 1.4;
    }

    .arrow {
      align-self: center;
      font-size: 1.6rem;
      color: var(--fach);
      padding: 0 .2rem;
    }

    /* numbered vertical list */
    .num-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: .7rem;
    }

    .num-list li {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      background: transparent;
      border: 0;
      border-bottom: 2px solid var(--fach);
      border-radius: 0;
      padding: .72rem .15rem;
    }

    .num-list .n {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      border: 2px solid var(--fach);
      background: transparent;
      color: var(--fach);
      font-family: var(--mono);
      font-size: .76rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .num-list .t {
      font-size: 1.02rem;
      line-height: 1.4;
    }

    /* two column compare */
    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }

    .compare .col {
      border-radius: 6px;
      padding: 1.2rem;
    }

    .compare .weak {
      background: var(--accent-a);
      border: 2px solid var(--accent-b);
      color: var(--fach-deep);
    }

    .compare .strong {
      background: var(--fach);
      border: 2px solid var(--fach);
      color: var(--bg);
    }

    .compare .pair {
      background: var(--card);
      border: 2px solid var(--fach);
      color: var(--ink);
    }

    .compare h3 {
      margin: 0 0 .5rem 0;
    }

    .compare .weak h3 {
      color: var(--fach-deep);
    }

    .compare .strong h3 {
      color: var(--accent-a);
    }

    .compare .strong p,
    .compare .strong li {
      color: var(--bg);
    }

    .compare .pair h3 {
      color: var(--fach);
    }

    .compare .prompt {
      font-family: Consolas, Menlo, monospace;
      font-size: .92rem;
      background: rgba(0, 0, 0, .04);
      border-radius: 6px;
      padding: .6rem .8rem;
      margin: .5rem 0;
      line-height: 1.5;
    }

    .compare .result {
      font-size: .9rem;
      color: var(--sub);
      font-style: italic;
    }

    .compare.stacked {
      grid-template-columns: 1fr;
      gap: .75rem;
    }

    .compare.stacked .col {
      padding: 1rem;
    }

    /* workflow arrow chains (Schritt → Schritt) */
    .slider-flow {
      font-family: var(--mono);
      font-size: .86rem;
      letter-spacing: .01em;
      color: var(--sub);
    }

    /* AI-generated infographic example */
    .infografik-panel {
      background: #fff;
      border: 2px solid var(--fach);
      border-radius: 10px;
      padding: 1rem 1.1rem .8rem;
      margin: 1rem 0;
    }

    .infografik-panel svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .infografik-caption {
      font-size: .78rem;
      color: var(--sub);
      font-style: italic;
      margin-top: .4rem;
      text-align: right;
    }

    /* Ebene 3: Vertiefung auf Abruf (Accordion) */
    .reveal-accordion {
      margin-top: 1rem;
    }

    .reveal-trigger {
      font-family: var(--mono);
      font-size: .82rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--fach);
      background: var(--card);
      border: 2px solid var(--fach);
      border-radius: 6px;
      padding: .6rem 1rem;
      cursor: pointer;
    }

    .reveal-trigger:hover,
    .reveal-trigger:focus-visible {
      background: var(--fach);
      color: var(--bg);
    }

    .reveal-trigger[aria-expanded="true"]::after {
      content: " (schließen)";
    }

    .reveal-panel {
      margin-top: .8rem;
      animation: reveal-fade .35s ease;
    }

    @media (prefers-reduced-motion:reduce) {
      .reveal-panel {
        animation: none;
      }
    }

    @keyframes reveal-fade {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------- v3: Desktop-Informationshierarchie (info-primary/secondary/tertiary) ---------- */
    /* Alle drei Ebenen bleiben auf dem Desktop dauerhaft sichtbar; Hierarchie entsteht rein über
     Größe/Kontrast/Abstand, nicht über automatischen Wechsel. Ebene 3 klappt bei schmalem Viewport
     weg, Ebene 2+3 bei Smartphone-Breite. Keine automatische Rotation von Inhalten. */
    .info-primary {
      opacity: 1;
    }

    .info-secondary {
      opacity: .72;
      font-size: .92em;
    }

    .info-tertiary {
      opacity: .48;
      font-size: .85em;
    }

    .info-block {
      margin: 1rem 0;
    }

    .info-label {
      display: block;
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .09em;
      text-transform: uppercase;
      margin-bottom: .45rem;
      opacity: .85;
    }

    .info-secondary .info-label {
      color: var(--accent-a);
    }

    .info-tertiary .info-label {
      color: var(--sub);
    }

    .info-matrix {
      width: 100%;
      border-collapse: collapse;
      font-size: .86rem;
    }

    .info-matrix th,
    .info-matrix td {
      border: 1px solid var(--card-border);
      padding: .5rem .7rem;
      text-align: left;
      vertical-align: top;
    }

    .info-matrix th {
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      background: var(--card);
    }

    .info-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem .6rem;
      font-size: .82rem;
    }

    .info-tags span {
      white-space: nowrap;
    }

    .info-tags span:not(:last-child)::after {
      content: "·";
      margin-left: .6rem;
      opacity: .6;
    }

    @media (max-width:1099px) {
      .info-tertiary {
        display: none;
      }
    }

    @media (max-width:699px) {

      .info-secondary,
      .info-tertiary {
        display: none !important;
      }

      [data-mobile-hint] {
        display: block !important;
        font-weight: 700;
        margin-top: .6rem;
      }
    }

    /* KARFF formula */
    .karff {
      display: flex;
      gap: .8rem;
      flex-wrap: wrap;
    }

    .kletter {
      flex: 1;
      min-width: 170px;
      background: var(--card);
      border: 2px solid var(--fach);
      border-radius: 6px;
      padding: 1rem;
      text-align: left;
    }

    .kletter:nth-child(2),
    .kletter:nth-child(5) {
      background: var(--fach);
      color: var(--bg);
    }

    .kletter:nth-child(3) {
      background: var(--accent-a);
      color: var(--fach-deep);
      border-color: var(--accent-b);
    }

    .kletter .big {
      font-family: var(--serif);
      font-size: 2.8rem;
      font-weight: 500;
      color: var(--fach);
      line-height: .9;
    }

    .kletter:nth-child(2) .big,
    .kletter:nth-child(5) .big {
      color: var(--accent-a);
    }

    .kletter .word {
      font-weight: 500;
      margin: .45rem 0;
    }

    .kletter .desc {
      font-size: .85rem;
      color: var(--sub);
    }

    /* annotated prompt */
    .prompt-box {
      background: var(--card);
      border: 2px solid var(--fach);
      border-radius: 6px;
      padding: 1.2rem 1.4rem;
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .an-rolle {
      background: var(--accent-a);
      border-bottom: 2px solid var(--accent-b);
    }

    .an-kontext {
      background: var(--card);
      border-bottom: 2px solid var(--fach);
    }

    .an-aufgabe {
      background: var(--fach);
      color: var(--bg);
      border-bottom: 2px solid var(--accent-a);
    }

    .an-format {
      background: var(--accent-a);
      border-bottom: 2px solid var(--fach);
    }

    .an-fein {
      background: var(--card);
      border-bottom: 2px solid var(--accent-b);
    }

    .legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: .88rem;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
    }

    .legend i {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }

    .legend span:nth-child(1) i,
    .legend span:nth-child(4) i {
      background: var(--accent-a) !important;
      border-color: var(--accent-b) !important;
    }

    .legend span:nth-child(2) i,
    .legend span:nth-child(5) i {
      background: var(--card) !important;
      border-color: var(--fach) !important;
    }

    .legend span:nth-child(3) i {
      background: var(--fach) !important;
      border-color: var(--accent-a) !important;
    }

    /* generic table */
    table.deck-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .95rem;
    }

    table.deck-table th {
      background: var(--fach);
      color: var(--accent-a);
      font-family: var(--mono);
      font-size: .76rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-align: left;
      padding: .65rem .8rem;
    }

    table.deck-table td {
      border: 1px solid var(--fach);
      padding: .65rem .8rem;
      vertical-align: top;
    }

    /* boxes */
    .box {
      border-radius: 0;
      padding: .82rem 1rem;
      margin-top: .7rem;
      font-size: .98rem;
      line-height: 1.45;
      border-top: 2px solid var(--fach);
    }

    .box-merk {
      background: transparent;
      border-color: var(--fach);
    }

    .box-warn {
      background: var(--card);
      border-color: var(--accent-b);
    }

    .box-danger {
      background: var(--accent-a);
      border-color: var(--fach);
      color: var(--fach-deep);
    }

    .box b {
      color: var(--fach);
    }

    .box-warn b {
      color: var(--accent-b);
    }

    .box-danger b {
      color: var(--danger-border);
    }

    /* praxisphase */
    .praxis {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    .praxis ol {
      margin: 0;
      padding-left: 1.2rem;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .praxis ol li {
      margin-bottom: .4rem;
    }

    .side-panel {
      background: var(--fach);
      color: var(--bg);
      border-radius: 6px;
      padding: 1.2rem;
      border: 2px solid var(--fach);
    }

    .side-panel .ab {
      color: var(--accent-a);
      font-family: var(--serif);
      font-size: 2rem;
      line-height: 1;
      font-weight: 500;
      margin-bottom: .5rem;
    }

    .side-panel .zeit {
      font-size: 1.1rem;
      font-weight: 700;
      margin: .6rem 0 .3rem 0;
    }

    .side-panel .tip {
      font-size: .88rem;
      opacity: .9;
      margin-top: .6rem;
    }

    /* stations grid */
    .stations {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .9rem;
    }

    .stations.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .station {
      background: var(--card);
      border: 2px solid var(--fach);
      border-radius: 6px;
      padding: .9rem 1.1rem;
      display: flex;
      gap: .8rem;
      align-items: flex-start;
    }

    .station:nth-child(3n+1) {
      background: var(--fach);
      color: var(--bg);
    }

    .station:nth-child(3n+2) {
      background: var(--accent-a);
      color: var(--fach-deep);
      border-color: var(--accent-b);
    }

    .station .snum {
      font-family: var(--mono);
      font-weight: 500;
      color: var(--fach);
      font-size: .82rem;
      letter-spacing: .1em;
      min-width: 1.6rem;
    }

    .station:nth-child(3n+1) .snum,
    .station:nth-child(3n+1) h3,
    .station:nth-child(3n+1) p {
      color: var(--accent-a);
    }

    .station h3 {
      margin: 0 0 .2rem 0;
      font-size: 1rem;
    }

    .station p {
      margin: 0;
      font-size: .88rem;
      color: var(--sub);
    }

    /* KI-Ampel Schule */
    .ampel-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .ampel-tile {
      border-radius: 18px;
      padding: 1.1rem 1.2rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 28px rgba(43, 35, 83, .08);
      background: var(--card);
    }

    .ampel-tile .glyph {
      font-size: 1.8rem;
      line-height: 1;
      display: block;
      margin-bottom: .5rem;
    }

    .ampel-tile .label {
      font-family: "General Sans", sans-serif;
      font-weight: 800;
      font-size: .76rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .45rem;
    }

    .ampel-tile p {
      margin: 0;
      font-size: .86rem;
      line-height: 1.42;
      color: var(--ink);
    }

    .ampel-tile.rot {
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    .ampel-tile.rot .label {
      color: var(--danger-border);
    }

    .ampel-tile.gelb {
      background: var(--warn-bg);
      border-color: var(--warn-border);
    }

    .ampel-tile.gelb .label {
      color: #8a5a00;
    }

    .ampel-tile.blau {
      background: #e8f0ff;
      border-color: #2f6fed;
    }

    .ampel-tile.blau .label {
      color: #2352b3;
    }

    .ampel-tile.gruen {
      background: #e6f7f1;
      border-color: var(--accent-c);
    }

    .ampel-tile.gruen .label {
      color: #0e7a5f;
    }

    @media (max-width:1099px) {
      .ampel-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width:640px) {
      .ampel-grid {
        grid-template-columns: 1fr;
      }
    }

    /* footer bar */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 7px;
      right: 0;
      min-height: 5.6vh;
      display: flex;
      flex-wrap: wrap;
      row-gap: .15rem;
      align-items: center;
      justify-content: space-between;
      padding: .4rem 2rem calc(.4rem + var(--safe-b)) 2rem;
      background: var(--bg);
      border-top: 1px solid rgba(46, 74, 42, .42);
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--sub);
      z-index: 40;
      transition: background .25s, color .25s, border-color .25s;
    }

    .footer-bar .title-mini {
      font-weight: 700;
      color: var(--fach);
      white-space: nowrap;
    }

    .footer-bar .count {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .footer-bar .hint {
      opacity: .7;
      white-space: nowrap;
    }

    body.dark-slide .footer-bar {
      background: var(--fach);
      color: var(--accent-a);
      border-color: var(--accent-a);
    }

    body.dark-slide .footer-bar .title-mini {
      color: var(--accent-a);
    }

    body.dark-slide .navbtn {
      background: var(--fach);
      color: var(--accent-a);
      border-color: var(--accent-a);
    }

    body.accent-slide .footer-bar {
      background: var(--accent-a);
      color: var(--fach-deep);
      border-color: var(--fach-deep);
    }

    body.accent-slide .footer-bar .title-mini {
      color: var(--fach-deep);
    }

    body.accent-slide .navbtn {
      background: var(--accent-a);
      color: var(--fach-deep);
      border-color: var(--fach-deep);
    }

    /* nav buttons */
    .navbtn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--fach);
      background: var(--bg);
      color: var(--fach);
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
    }

    .navbtn:hover {
      background: var(--fach);
      color: var(--accent-a);
    }

    #prev-btn {
      left: calc(22px + var(--safe-l));
    }

    #next-btn {
      right: calc(22px + var(--safe-r));
    }

    /* notes drawer */
    #notes-drawer {
      position: fixed;
      left: 7px;
      right: 0;
      bottom: 0;
      height: 0;
      overflow: hidden;
      background: var(--fach);
      color: var(--bg);
      z-index: 70;
      transition: height .3s ease;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--safe-b);
    }

    #notes-drawer.open {
      height: 26vh;
    }

    #notes-drawer .nd-head {
      padding: .6rem 1.5rem 0 1.5rem;
      font-family: var(--mono);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--accent-a);
      font-weight: 500;
    }

    #notes-drawer .nd-body {
      padding: .4rem 1.5rem 1rem 1.5rem;
      font-size: 1.05rem;
      line-height: 1.55;
      overflow-y: auto;
    }

    /* overview grid */
    #overview {
      position: fixed;
      inset: 0;
      background: var(--fach);
      z-index: 80;
      display: none;
      padding: 4vh 4vw;
      overflow-y: auto;
    }

    #overview.open {
      display: block;
    }

    #overview h2 {
      color: var(--accent-a);
      margin: 0 0 1.4rem 0;
      font-family: var(--serif);
      font-weight: 500;
    }

    #overview .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: .9rem;
    }

    #overview .ov-item {
      background: transparent;
      border: 2px solid var(--accent-a);
      border-radius: 6px;
      padding: .8rem 1rem;
      cursor: pointer;
      color: var(--bg);
    }

    #overview .ov-item:hover {
      background: var(--accent-a);
      color: var(--fach-deep);
    }

    #overview .ov-item .n {
      color: var(--accent-a);
      font-family: var(--mono);
      font-weight: 500;
      font-size: .7rem;
    }

    #overview .ov-item .t {
      font-size: .92rem;
      margin-top: .2rem;
      line-height: 1.3;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--fach);
      border-radius: 0;
    }

    @media (max-width:1099px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .timeline {
        grid-template-columns: 1fr;
        gap: .9rem;
      }

      .stations,
      .stations.cols-3 {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width:980px) {
      .compare {
        grid-template-columns: 1fr;
        gap: .9rem;
      }

      .options {
        grid-template-columns: 1fr;
      }

      .praxis {
        grid-template-columns: 1fr;
      }

      .side-panel {
        margin-top: .4rem;
      }
    }

    @media (max-width:900px) {
      .cards.cols-2 {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width:640px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .karff {
        flex-direction: column;
      }
    }

    @media (max-width:900px) {
      .cover {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        text-align: left;
        overflow: hidden;
      }

      .cover .content {
        display: contents;
      }

      .cover .kicker {
        order: 0;
      }

      .cover h1.title {
        order: 1;
        max-width: none;
      }

      .cover .subtitle {
        order: 2;
        max-width: none;
      }

      .cover .meta {
        order: 4;
        margin-top: 1rem;
      }

      .steps {
        flex-direction: column;
        align-items: stretch;
      }

      .steps .arrow {
        display: none;
      }

      .model-split .steps {
        grid-template-columns: 1fr;
      }

      .footer-bar .hint {
        display: none;
      }
    }

    @media (max-height:650px) and (min-width:901px) {
      .slide {
        padding-top: 18px;
        padding-bottom: 58px;
      }

      .cover h1.title {
        font-size: clamp(1.9rem, 1rem + 3vw, 3rem);
      }

      .cover .subtitle {
        margin-bottom: .8rem;
      }

      .cover .meta {
        margin-top: .5rem;
        padding-top: .65rem;
      }

      .card {
        padding: .75rem 1rem;
      }

      .box {
        padding: .7rem .9rem;
      }
    }

    @media (max-width:560px) {
      .model-split .steps {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- modern Canva-inspired visual system ---------- */
    html,
    body {
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
    }

    .slide {
      background:
        radial-gradient(circle at 96% 5%, rgba(139, 92, 246, .12), transparent 24%),
        radial-gradient(circle at 8% 96%, rgba(23, 184, 151, .08), transparent 22%),
        var(--bg);
    }

    .slide::before {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: 4vw;
      top: -105px;
      border: 28px solid rgba(255, 111, 97, .16);
      border-radius: 50%;
      pointer-events: none;
    }

    .slide>* {
      position: relative;
      z-index: 1;
    }

    .kicker {
      display: inline-flex;
      width: max-content;
      align-items: center;
      padding: .42rem .72rem;
      border: 1px solid rgba(139, 92, 246, .2);
      border-radius: 999px;
      background: #eee9ff;
      color: #6842dc;
      font-family: "Inter", sans-serif;
      font-size: clamp(.64rem, .58rem + .24vw, .75rem);
      font-weight: 700;
      letter-spacing: .09em;
    }

    h1.title {
      font-family: "General Sans", "Avenir Next", Arial, sans-serif;
      font-weight: 800;
      font-size: clamp(1.9rem, 1.08rem + 2.7vw, 3.35rem);
      line-height: 1.02;
      letter-spacing: -.045em;
      color: var(--fach);
      margin-bottom: .8rem;
    }

    .subtitle {
      font-family: "Inter", sans-serif;
      color: var(--sub);
    }

    .lead {
      font-family: "Inter", sans-serif;
      line-height: 1.48;
    }

    .cover {
      background:
        radial-gradient(circle at 14% 18%, rgba(139, 92, 246, .42), transparent 28%),
        linear-gradient(135deg, #17182f 0%, #232341 58%, #141526 100%);
    }

    .cover::before {
      width: 230px;
      height: 230px;
      top: auto;
      right: auto;
      left: -100px;
      bottom: -120px;
      border-color: rgba(23, 184, 151, .34);
    }

    .cover .kicker {
      color: #e4dcff;
      background: rgba(255, 255, 255, .1);
      border-color: rgba(255, 255, 255, .22);
    }

    .cover h1.title {
      color: #fff;
      font-size: clamp(2.7rem, 1.25rem + 4.5vw, 5.2rem);
      line-height: .94;
      max-width: 10ch;
    }

    .cover .subtitle {
      color: #e9e8f4;
    }

    .cover .meta {
      color: #d8d5ea;
      border-color: rgba(255, 255, 255, .28);
      font-family: "Inter", sans-serif;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .card,
    .option,
    .step,
    .kletter,
    .station,
    .prompt-box {
      background: rgba(255, 255, 255, .92);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(43, 35, 83, .08);
    }

    .cards>.card:nth-child(3n+1),
    .station:nth-child(3n+1),
    .step:nth-of-type(1),
    .kletter:nth-child(2),
    .kletter:nth-child(5) {
      background: #292a4a;
      color: #fff;
      border-color: #292a4a;
    }

    .cards>.card:nth-child(3n+1) h2,
    .station:nth-child(3n+1) h3,
    .station:nth-child(3n+1) .snum,
    .kletter:nth-child(2) .big,
    .kletter:nth-child(5) .big {
      color: #c8b8ff;
    }

    .cards>.card:nth-child(3n+1) p,
    .station:nth-child(3n+1) p {
      color: #eeeefa;
    }

    .cards>.card:nth-child(3n+2),
    .station:nth-child(3n+2),
    .kletter:nth-child(3) {
      background: #fff0ed;
      color: var(--fach);
      border-color: #ffd4ce;
    }

    .cards>.card:nth-child(3n+2) h2,
    .cards>.card:nth-child(3n+2) p {
      color: var(--fach);
    }

    .card h2 {
      font-family: "General Sans", sans-serif;
      font-weight: 800;
      color: var(--fach);
    }

    .option {
      text-align: center;
    }

    .option:nth-child(1) {
      background: #292a4a;
      color: #fff;
    }

    .option:nth-child(2) {
      background: #eee9ff;
      color: var(--fach);
      border-color: #dcd2ff;
    }

    .option:nth-child(1) .name,
    .option:nth-child(1) .quote {
      color: #e8e1ff;
    }

    .option .name {
      color: #6842dc;
      font-family: "General Sans", sans-serif;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: none;
      font-size: 1.05rem;
    }

    .num-list li {
      border-bottom: 1px solid #dcd8eb;
      padding: .75rem .1rem;
    }

    .num-list .n {
      border: 0;
      background: #eee9ff;
      color: #6842dc;
      font-family: "General Sans", sans-serif;
      font-weight: 800;
    }

    .compare .col {
      border-radius: 20px;
      box-shadow: 0 10px 28px rgba(43, 35, 83, .08);
    }

    .compare .strong {
      background: #292a4a;
      border: 0;
      color: #fff;
    }

    .compare .strong h3 {
      color: #c8b8ff;
    }

    .compare .weak {
      background: #fff0ed;
      border: 1px solid #ffd4ce;
      color: var(--fach);
    }

    .compare .weak h3 {
      color: #d74f44;
    }

    .box {
      border: 0;
      border-radius: 14px;
      padding: .85rem 1rem;
    }

    .box-merk {
      background: #e9f8f4;
      border-left: 4px solid var(--accent-c);
    }

    .box-warn {
      background: var(--warn-bg);
      border-left: 4px solid var(--warn-border);
    }

    .box-danger {
      background: var(--danger-bg);
      border-left: 4px solid var(--danger-border);
      color: var(--fach);
    }

    .side-panel {
      border: 0;
      border-radius: 20px;
      background: linear-gradient(145deg, #6c4ff8, #8b5cf6);
      box-shadow: 0 14px 34px rgba(108, 79, 248, .22);
    }

    .side-panel .ab {
      color: #fff;
      font-family: "General Sans", sans-serif;
      font-weight: 800;
    }

    .timeline h3 {
      font-family: "Inter", sans-serif;
      color: #6842dc;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .t-item {
      border-color: #dedbea;
    }

    .t-item .time {
      color: #6842dc;
      font-family: "Inter", sans-serif;
      font-weight: 800;
    }

    .prompt-box {
      background: #fff;
    }

    .an-rolle,
    .an-format {
      background: #ffe8e4;
    }

    .an-kontext,
    .an-fein {
      background: #e9f8f4;
    }

    .an-aufgabe {
      background: #eee9ff;
      color: var(--fach);
      border-color: #8b5cf6;
    }

    .slide-pink {
      background: linear-gradient(145deg, #f1edff 0%, #fff6f4 100%);
      color: var(--fach);
    }

    .slide-pink h1.title,
    .slide-pink .kicker {
      color: var(--fach);
    }

    .slide-summary,
    .closing {
      background: linear-gradient(135deg, #191a31 0%, #292a4a 65%, #17182c 100%);
    }

    .slide-summary::before,
    .closing::before {
      border-color: rgba(139, 92, 246, .38);
    }

    .slide-summary h1.title,
    .closing h1.title {
      color: #fff;
    }

    .slide-summary .kicker,
    .closing .kicker {
      color: #ded4ff;
      background: rgba(255, 255, 255, .1);
      border-color: rgba(255, 255, 255, .2);
    }

    .slide-summary .num-list li {
      border-color: rgba(255, 255, 255, .18);
    }

    .slide-summary .num-list .n {
      background: #8b5cf6;
      color: #fff;
    }

    #progress-track {
      width: 7px;
      background: linear-gradient(180deg, #8b5cf6 0%, #ff6f61 52%, #17b897 100%);
    }

    #progress-mask {
      width: 7px;
      background: #302f48;
    }

    #progress-dot {
      background: #fff;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, .18);
    }

    .footer-bar {
      background: rgba(247, 246, 252, .88);
      border-color: rgba(32, 33, 58, .1);
      font-family: "Inter", sans-serif;
      font-weight: 700;
      letter-spacing: .05em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    body.dark-slide .footer-bar {
      background: rgba(24, 25, 48, .9);
      color: #dcd5f4;
      border-color: rgba(255, 255, 255, .12);
    }

    body.dark-slide .footer-bar .title-mini {
      color: #fff;
    }

    body.accent-slide .footer-bar {
      background: rgba(244, 240, 255, .9);
      color: var(--fach);
      border-color: rgba(32, 33, 58, .1);
    }

    body.accent-slide .footer-bar .title-mini {
      color: var(--fach);
    }

    .navbtn {
      border: 0;
      background: rgba(255, 255, 255, .9);
      color: #6842dc;
      box-shadow: 0 8px 24px rgba(43, 35, 83, .14);
      backdrop-filter: blur(10px);
    }

    .navbtn:hover {
      background: #6c4ff8;
      color: #fff;

        notes: "Stille Einzelarbeit zulassen. Optional: Vorhaben in Murmelrunde teilen – öffentliches Commitment erhöht die Umsetzungswahrscheinlichkeit. Auf Follow-up-Termin verweisen, falls vereinbart. AB 1 (Deskilling-Selbstcheck) wurde bereits in Modul 1 bearbeitet; AB 8 (Mein Aktionsplan, jetzt inkl. Abschnitt „KI und Prüfungskultur“) ist die Vertiefung für zu Hause."
      },
      {
        kicker: "Zum Mitnehmen",
        title: "Wenn ihr nur sechs Dinge behaltet …",
        body: `
    <ol class="num-list" style="list-style:none;">
      <li><span class="n">1</span><span class="t">Keine Schülerdaten in nicht freigegebene KI-Systeme – Pseudonymisierung reicht oft nicht.</span></li>
      <li><span class="n">2</span><span class="t">KI-Ergebnisse sind Entwürfe: prüfen, anpassen, verantworten.</span></li>
      <li><span class="n">3</span><span class="t">KARFF macht Prompts stark: Kontext, Aufgabe, Rolle, Format, Feinschliff.</span></li>
      <li><span class="n">4</span><span class="t">Nachteilsausgleich verändert Bedingungen – nicht Anforderungen.</span></li>
      <li><span class="n">5</span><span class="t">Erst denken, dann prompten – gegen Skill-Skipping und Deskilling.</span></li>
      <li><span class="n">6</span><span class="t">Beziehung, Bewertung, Entscheidung: bleibt beim Menschen.</span></li>
    </ol>
    <p class="info-secondary" style="margin-top:.6rem;">Unterstützen · prüfen · transparent machen · verantwortlich entscheiden</p>
  `,
        notes: "Mit den Erwartungskarten vom Morgen abgleichen: Was wurde erfüllt, was nehmen wir in die Follow-ups? Regel 5 fasst den Denken-Block aus Modul 1 zusammen. Danach Feedbackrunde (Zielscheibe an der Pinnwand oder digitales Tool)."
      },
      {
        kicker: "Abschluss",
        title: "Danke für eure Neugier!",
        cls: "closing",
        body: `
    <p class="lead info-primary" style="max-width:50ch;">Der beste Zeitpunkt anzufangen ist die nächste Unterrichtsvorbereitung.</p>
    <p class="info-secondary" style="margin-top:.4rem;">Was probiert ihr als Erstes aus?</p>
    <p class="info-tertiary">Feedback: Zielscheibe an der Pinnwand · Kontakt: [E-Mail]</p>
    <p class="info-tertiary" style="font-size:.9rem;">Materialien: Ablaufplan · AB 1–8 (inkl. AB 4A–4E) · Schüler-AB „Denkst du noch selbst?“ · Vorlagen &amp; Hilfekarten · diese Präsentation</p>
    <p style="color:var(--sub); font-size:.78rem; font-style:italic;">Erstellungshinweis: Mit Unterstützung generativer KI erstellt; fachlich und didaktisch geprüft und überarbeitet.</p>
  `,
        notes: "Verabschiedung. Materialien digital teilen (Schulcloud). Falls Follow-up vereinbart: Termin nennen. Letzter Satz: Probiert EINE Sache in den nächsten 14 Tagen aus – mehr braucht es nicht für den Anfang."
      }
    ];


    /* ---------- scrollytelling image map ---------- */
    const STORY_ASSETS = {
      welcome: 'assets/ki-fortbildung/titel-ki-im-schulalltag.png',
      model: 'assets/ki-fortbildung/sprachmodell-naechstes-wort.png',
      thinking: 'assets/ki-fortbildung/denken-mit-ki.png',
      privacy: 'assets/ki-fortbildung/datenschutz-schuelerdaten.png',
      prompting: 'assets/ki-fortbildung/prompting-struktur.png',
      tools: 'assets/ki-fortbildung/tool-landschaft.png',
      planning: 'assets/ki-fortbildung/halbjahresplanung.png',
      inclusion: 'assets/ki-fortbildung/faire-differenzierung.png',
      conversation: 'assets/ki-fortbildung/lernentwicklungsgespraech.png',
      transfer: 'assets/ki-fortbildung/transfer-schulkultur.png'
    };
    const STORY_IMAGE_KEYS = [
      'welcome', 'welcome', 'welcome',
      'model', 'model', 'model',
      'thinking', 'thinking', 'thinking', 'thinking',
      'privacy', 'privacy', 'privacy', 'privacy', 'privacy',
      'prompting', 'prompting', 'prompting', 'prompting',
      'planning', 'planning', 'planning', 'planning',
      'tools', 'tools', 'tools',
      'inclusion', 'inclusion', 'inclusion', 'inclusion',
      'conversation', 'conversation', 'conversation',
      'transfer', 'transfer', 'transfer', 'transfer', 'transfer',
      'transfer', 'transfer', 'transfer', 'transfer', 'transfer'
    ];
    const STORY_FEATURE_SLIDES = new Set([0, 2, 3, 6, 9, 11, 12, 15, 16, 19, 20, 22, 28, 30, 31, 34, 35, 37, 38, 40, 42]);

    Object.values(STORY_ASSETS).forEach(src => { const preload = new Image(); preload.src = src; });

    /* ---------- true viewport height (avoids OS chrome clipping content) ---------- */
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', setAppHeight); }

    /* ---------- render ---------- */
    const deck = document.getElementById('deck');
    SLIDES.forEach((s, i) => {
      const el = document.createElement('section');
      el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
      if ((s.kicker || '').includes('Praxisphase')) el.classList.add('slide-pink');
      if (s.kicker === 'Zum Mitnehmen') el.classList.add('slide-summary');
      el.classList.add(STORY_FEATURE_SLIDES.has(i) ? 'story-feature' : 'story-ambient');
      el.id = 'slide-' + i;
      el.innerHTML = `
    <div class="kicker">${s.kicker}</div>
    <h1 class="title">${s.title}</h1>
    ${s.subtitle ? `<p class="subtitle">${s.subtitle}</p>` : ''}
    <div class="content">${s.body}</div>
  `;
      deck.appendChild(el);
    });

    /* Angaben aus der Startseite (index.html) übernehmen */
    (function befuelleVeranstaltungsangaben() {
      let daten = {};
      try { daten = JSON.parse(localStorage.getItem('ki-fortbildung-veranstaltung')) || {}; }
      catch (e) { daten = {}; }
      const metaEl = document.querySelector('#slide-0 .meta');
      if (!metaEl) return;
      let datumText = '[Datum]';
      if (daten.datum) {
        const d = new Date(daten.datum + 'T00:00:00');
        if (!isNaN(d)) datumText = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
      }
      const teile = [daten.referent || '[Name]', datumText, daten.ort || '[Ort]'];
      metaEl.textContent = teile.join(' · ');
    })();

    const overviewGrid = document.getElementById('overview-grid');
    SLIDES.forEach((s, i) => {
      const item = document.createElement('div');
      item.className = 'ov-item';
      item.innerHTML = `<div class="n">${i + 1} / ${SLIDES.length}</div><div class="t">${s.title}</div>`;
      item.addEventListener('click', () => { goTo(i); toggleOverview(false); });
      overviewGrid.appendChild(item);
    });

    document.getElementById('total-num').textContent = SLIDES.length;

    const SLIDE_STORAGE_KEY = 'ki-fortbildung-praesentation-folie';
    function initialSlideIndex() {
      const fromUrl = parseInt(new URLSearchParams(location.search).get('folie'), 10);
      if (!Number.isNaN(fromUrl)) return Math.max(0, Math.min(SLIDES.length - 1, fromUrl));
      const stored = parseInt(localStorage.getItem(SLIDE_STORAGE_KEY), 10);
      if (!Number.isNaN(stored)) return Math.max(0, Math.min(SLIDES.length - 1, stored));
      return 0;
    }

    let current = initialSlideIndex();
    const slideEls = document.querySelectorAll('.slide');

    /* ---------- Klick-Reveal (Accordion) — nur noch für echte Auflösungen, keine Auto-Rotation mehr (v3) ---------- */
    document.querySelectorAll('.reveal-trigger').forEach(btn => {
      const panel = document.getElementById(btn.getAttribute('aria-controls'));
      if (!panel) return;
      btn.addEventListener('click', () => {
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!expanded));
        panel.hidden = expanded;
      });
    });

    const mask = document.getElementById('progress-mask');
    const dot = document.getElementById('progress-dot');
    const storyMedia = document.getElementById('story-media');
    const storyLayers = [...storyMedia.querySelectorAll('.story-layer')];
    let activeStoryLayer = 0;
    let activeStorySrc = '';
    let storyDrift = false;

    function storySource(index) {
      return STORY_ASSETS[STORY_IMAGE_KEYS[index] || 'welcome'];
    }

    function setStoryVisual(index, direction = 1, immediate = false) {
      const src = storySource(index);
      const feature = STORY_FEATURE_SLIDES.has(index);
      storyMedia.classList.toggle('feature', feature);
      storyMedia.classList.toggle('ambient', !feature);

      if (src === activeStorySrc && !immediate) {
        storyDrift = !storyDrift;
        const layer = storyLayers[activeStoryLayer];
        layer.classList.toggle('drift-alt', storyDrift);
        layer.querySelector('.story-caption').innerHTML = SLIDES[index].kicker;
        return;
      }

      const nextLayerIndex = immediate ? activeStoryLayer : 1 - activeStoryLayer;
      const nextLayer = storyLayers[nextLayerIndex];
      const oldLayer = storyLayers[activeStoryLayer];
      const enterClass = direction < 0 ? 'enter-prev' : 'enter-next';
      const exitClass = direction < 0 ? 'exit-prev' : 'exit-next';

      if (nextLayer._cleanupTimer) clearTimeout(nextLayer._cleanupTimer);
      nextLayer.className = `story-layer ${enterClass}`;
      nextLayer.querySelector('img').src = src;
      nextLayer.querySelector('.story-caption').innerHTML = SLIDES[index].kicker;
      void nextLayer.offsetWidth;

      if (immediate) {
        nextLayer.className = 'story-layer active';
      } else {
        oldLayer.classList.remove('active', 'drift-alt');
        oldLayer.classList.add(exitClass);
        requestAnimationFrame(() => {
          nextLayer.classList.add('active');
          nextLayer.classList.remove(enterClass);
        });
        if (oldLayer._cleanupTimer) clearTimeout(oldLayer._cleanupTimer);
        oldLayer._cleanupTimer = setTimeout(() => {
          if (!oldLayer.classList.contains('active')) oldLayer.className = 'story-layer';
        }, 1100);
      }

      activeStoryLayer = nextLayerIndex;
      activeStorySrc = src;
      storyDrift = false;
    }

    function render(previous = null, direction = 0) {
      if (previous === null) {
        slideEls.forEach((el, i) => el.classList.toggle('active', i === current));
        setStoryVisual(current, 1, true);
      } else {
        const oldSlide = slideEls[previous];
        const nextSlide = slideEls[current];
        const enterClass = direction < 0 ? 'enter-prev' : 'enter-next';
        const exitClass = direction < 0 ? 'exit-prev' : 'exit-next';
        slideEls.forEach((el, i) => {
          if (i !== previous && i !== current) el.classList.remove('active', 'enter-next', 'enter-prev', 'exit-next', 'exit-prev');
        });
        oldSlide.classList.remove('active', 'enter-next', 'enter-prev', 'exit-next', 'exit-prev');
        oldSlide.classList.add(exitClass);
        nextSlide.classList.remove('exit-next', 'exit-prev');
        nextSlide.classList.add(enterClass);
        void nextSlide.offsetWidth;
        requestAnimationFrame(() => {
          nextSlide.classList.add('active');
          nextSlide.classList.remove(enterClass);
        });
        setTimeout(() => { oldSlide.classList.remove(exitClass); }, 760);
        setStoryVisual(current, direction, false);
      }
      const activeSlide = slideEls[current];
      const isDark = activeSlide.classList.contains('cover') || activeSlide.classList.contains('closing') || activeSlide.classList.contains('slide-summary');
      const isAccent = activeSlide.classList.contains('slide-pink');
      document.body.classList.toggle('dark-slide', isDark);
      document.body.classList.toggle('accent-slide', isAccent);
      document.getElementById('cur-num').textContent = current + 1;
      document.getElementById('title-mini').textContent = SLIDES[current].kicker.replace(/&amp;/g, '&');
      document.getElementById('notes-body').textContent = SLIDES[current].notes || '(keine Notizen)';
      const total = SLIDES.length - 1;
      const t = total === 0 ? 1 : current / total;
      const vh = window.innerHeight;
      mask.style.top = (t * vh) + 'px';
      dot.style.top = (t * vh) + 'px';
      dot.style.borderColor = isDark ? 'var(--accent-a)' : 'var(--fach)';
      dot.style.background = isAccent ? 'var(--fach)' : 'var(--accent-a)';
      slideEls[current].scrollTop = 0;
    }

    function goTo(i) {
      const target = Math.max(0, Math.min(SLIDES.length - 1, i));
      if (target === current) return;
      const previous = current;
      const direction = target > current ? 1 : -1;
      current = target;
      localStorage.setItem(SLIDE_STORAGE_KEY, String(current));
      render(previous, direction);
    }
    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    document.getElementById('next-btn').addEventListener('click', next);
    document.getElementById('prev-btn').addEventListener('click', prev);

    function toggleNotes(force) {
      const d = document.getElementById('notes-drawer');
      d.classList.toggle('open', force !== undefined ? force : !d.classList.contains('open'));
    }
    function toggleOverview(force) {
      const o = document.getElementById('overview');
      o.classList.toggle('open', force !== undefined ? force : !o.classList.contains('open'));
    }
    function toggleFullscreen() {
      const el = document.documentElement;
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFs) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('overview').classList.contains('open')) {
        if (e.key === 'Escape' || e.key.toLowerCase() === 'o') { toggleOverview(false); }
        return;
      }
      switch (e.key) {
        case 'ArrowRight': case ' ': case 'PageDown': next(); e.preventDefault(); break;
        case 'ArrowLeft': case 'PageUp': prev(); e.preventDefault(); break;
        case 'Home': goTo(0); break;
        case 'End': goTo(SLIDES.length - 1); break;
        case 'n': case 'N': toggleNotes(); break;
        case 'o': case 'O': toggleOverview(true); break;
        case 'f': case 'F': toggleFullscreen(); break;
        case 'Escape': toggleNotes(false); break;
      }
    });

    let touchX = 0;
    document.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (dx > 60) prev(); else if (dx < -60) next();
    });

    window.addEventListener('resize', () => render());
    render();
  </script>
</body>

</html>
